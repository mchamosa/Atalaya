name: Actualizar datos cripto

on:
  schedule:
    - cron: "10,40 * * * *"   # cada 30 minutos, todos los días (el mercado cripto no cierra)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar datos
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -f update_crypto.py ]; then python update_crypto.py; else python scripts/update_crypto.py; fi
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datos cripto $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
