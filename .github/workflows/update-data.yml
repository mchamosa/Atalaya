name: Actualizar datos de mercado

on:
  schedule:
    - cron: "*/30 5-22 * * 1-5"   # cada 30 min, lunes a viernes (UTC)
    - cron: "0 8,18 * * 0,6"      # dos veces al día el fin de semana
  workflow_dispatch:               # botón "Run workflow" manual

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
        env:
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push
